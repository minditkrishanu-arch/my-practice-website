<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Practice Website</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>My First Website</h1>

        <nav>
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <main>

        <section id="home">
            <h2>Welcome</h2>
            <p>
                Welcome to my first practice website created using
                HTML, CSS and JavaScript.
            </p>

            <button onclick="showMessage()">
                Click Me
            </button>
        </section>

        <section id="about">
            <h2>About Me</h2>
            <p>
                I am learning website development using VS Code and GitHub.
            </p>
        </section>

        <section id="contact">
            <h2>Contact</h2>
            <p>Email: example@email.com</p>
        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
